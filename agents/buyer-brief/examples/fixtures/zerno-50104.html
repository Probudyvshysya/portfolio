<html><body><div class="field field-name-body"><div class="field-items"><div class="field-item even" property="content:encoded"><p>Отгрузки зерна через порты Юга за неделю снизились до минимума сезона. Экспортёры ссылаются на низкие мировые цены и высокие издержки фрахта.</p><p>Цены в портах снизились на 150 рублей за тонну.</p></div></div></div></body></html>
