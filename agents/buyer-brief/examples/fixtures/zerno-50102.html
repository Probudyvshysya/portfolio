<html><body><div class="field field-name-body"><div class="field-items"><div class="field-item even" property="content:encoded"><p>Средняя цена пшеницы 3 класса в Сибири за неделю выросла на 3 процента. Переработчики добирают сырьё до зимы, а хозяйства придерживают зерно в ожидании дальнейшего роста.</p><p>Аналитики ждут, что рост замедлится после завершения уборки в северных районах.</p></div></div></div></body></html>
