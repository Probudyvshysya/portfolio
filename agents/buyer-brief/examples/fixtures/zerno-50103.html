<html><body><div class="field field-name-body"><div class="field-items"><div class="field-item even" property="content:encoded"><p>Закупочные интервенции пройдут на площадках в Центральном, Южном и Приволжском федеральных округах. Государство будет покупать пшеницу 3 и 4 класса по фиксированной цене.</p><p>Торги начнутся во второй половине ноября.</p></div></div></div></body></html>
