[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buyer-brief"
version = "1.0.0"
description = "Утренняя сводка закупщика: открытые данные, правила отбора новостей, светофор и калькулятор сделки"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dmitry Ermakov" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
svodka = "svodka.cli:main"

[tool.setuptools]
packages = ["svodka"]

[tool.setuptools.package-data]
svodka = ["kalkulyator.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
