[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usn-bookkeeper"
version = "1.0.0"
description = "Бухгалтер для ИП на УСН «Доходы» 6 %: разбор выписки, доход и не доход, авансы, взносы, сроки, сравнение с АУСН"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dmitry Ermakov" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
usn = "usn.cli:main"

[tool.setuptools]
packages = ["usn"]

[tool.setuptools.package-data]
usn = ["stavki.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
