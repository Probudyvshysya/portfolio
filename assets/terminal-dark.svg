<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486">
<rect x="1" y="1" width="958" height="484" rx="14" fill="#0d1117" stroke="#30363d"/>
<path d="M1 15 a14 14 0 0 1 14 -14 h930 a14 14 0 0 1 14 14 v25 h-958z" fill="#161b22"/>
<circle cx="24" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="64" cy="21" r="6" fill="#28c840"/>
<text x="480" y="26" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7d8590">агенты проверки документов — пример на учебном комплекте</text>
<text x="28" y="78" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" xml:space="preserve">$ python -m dva gate examples/kit</text><text x="28" y="104" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#f87171" xml:space="preserve">🔴 КРАСНЫЙ: документов 2, проблемных 1</text><text x="28" y="130" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#7d8590" xml:space="preserve">   НЕ ПРОЧИТАН smeta_scan.pdf — скан без текста: нужно распознавание</text><text x="28" y="156" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#f87171" xml:space="preserve">   Решение принимать нельзя: комплект неполный.</text><text x="28" y="182" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" xml:space="preserve"></text><text x="28" y="208" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" xml:space="preserve">$ python -m dva refs examples/kit/tz.docx --library examples/library</text><text x="28" y="234" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" xml:space="preserve">Ссылок на нормативы: 5 · верных 4 · ошибочных 1</text><text x="28" y="260" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#f87171" xml:space="preserve">   ❌ п. 6.4.9 ГОСТ Р 90001-2024 — такого пункта в нормативе нет</text><text x="28" y="286" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" xml:space="preserve"></text><text x="28" y="312" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" xml:space="preserve">$ python -m dva norms --registry examples/registry.json --library examples/library</text><text x="28" y="338" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#4ade80" xml:space="preserve">   ✅ ГОСТ Р 90001-2024</text><text x="28" y="364" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#f87171" xml:space="preserve">   🔴 ПОДМЕНА СП 90002.2023 — внутри файла другой документ</text><text x="28" y="390" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#fb923c" xml:space="preserve">   🟠 УСТАРЕЛО ОДМ 90003-2022 — нет «Изменения № 2»</text><text x="28" y="416" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" xml:space="preserve"></text><text x="28" y="442" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" xml:space="preserve">$ python -m dva review examples/journal.jsonl</text><text x="28" y="468" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#fb923c" xml:space="preserve">   смещение прогноза +7.8 → ПРЕДЛОЖЕНИЕ: сдвинуть порог (вносит человек)</text>
</svg>